<!DOCTYPE html>

<head>

<body>

  <!-- القائمة العلوية -->
  <nav class="navbar">

      <a href="index.html" class="brand-logo-wrap">
        <img src="photos/logo.png" alt="لوجو د. أحمد حسن الماجري" class="site-logo">
      </a>
      <button class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="services.html">العمليات والجراحات</a></li>
        <li><a href="videos.html">فيديوهات توعوية</a></li>
        <li><a href="feedback.html">آراء المرضى</a></li>
        <li><a href="articles.html" class="active">المقالات الطبية</a></li>
        <li><a href="faq.html">الأسئلة الشائعة</a></li>
      </ul>
    </div>
  </nav>

  <div class="container" style="padding-top: 40px; margin-bottom: 60px;">
    <div class="section-title">
      <h2>المقالات والنصائح الطبية</h2>
      <p>اضغط على أي مقال لقراءة التفاصيل الكاملة واستعراض الصور في نافذة مخصصة</p>
    </div>

    <!-- شبكة المقالات بصور مربعة بنسبة 1:1 -->
    <div class="grid-cards" id="articlesGrid"></div>
  </div>

  <!-- نافذة الـ Pop-up للمقال -->
  <div class="modal-overlay" id="articleModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeArticleModal()">&times;</button>
      <h2 id="modalTitle" style="color: var(--primary); margin-bottom: 15px; font-weight: 800;"></h2>
      <div id="modalGallery" class="modal-gallery"></div>
      <!-- تم إضافة white-space: pre-line للحفاظ على أسطر النص -->
      <div id="modalBody" style="line-height: 1.8; color: var(--text-main); font-size: 1.05rem; white-space: pre-line;"></div>
    </div>
  </div>

  <!-- الأزرار العائمة -->
  <div class="floating-actions">
    <a href="https://wa.me/201111552364" target="_blank" class="float-btn whatsapp"><svg viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766 0-3.18-2.587-5.771-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.275.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824zm-3.423-14.416c-6.627 0-12 5.373-12 12 0 2.159.57 4.185 1.564 5.938l-1.564 5.719 5.86-1.537c1.706.938 3.666 1.48 5.74 1.48 6.627 0 12-5.373 12-12s-5.373-12-12-12z"/></svg></a>
    <a href="https://www.facebook.com/profile.php?id=61591004069520" target="_blank" class="float-btn facebook"><svg viewBox="0 0 24 24"><path d="M9 8H6v4h3v12h5V12h3.642L18 8h-4V6.333C14 5.374 14.5 5 15.688 5H18V0h-3.808C10.593 0 9 1.583 9 4.615V8z"/></svg></a>
  </div>

  <footer>
    <div class="container footer-bottom">
      جميع الحقوق محفوظة &copy; د. أحمد حسن الماجري
    </div>
  </footer>

  <script>
    document.getElementById('menuToggle').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('active');
    });

    const articlesData = [
      {
        id: 1,
        title: "جراحات القلب بالتدخل المحدود: المميزات وفترة الشفاء",
        summary: "تقنية طفرة تجرى عبر فتحات صغيرة لتجنب شق الصدر وتسريع عودة المريض لحياته الطبيعية...",
        content: `فكرة إن عملية القلب معناها شهور من الألم والراحة بقت من الماضي ❤️

مع جراحات التدخل المحدود، في حالات كتير بيكون الجرح أصغر، والألم أقل، وفترة التعافي أسرع، والرجوع للحياة الطبيعية بيكون في وقت أقصر مقارنة بالجراحات التقليدية، حسب حالة كل مريض.

التقييم الدقيق هو اللي بيحدد إذا كانت التقنية دي مناسبة لحالتك او لأ ✅

د. أحمد حسن الماجري 🫀
استشاري جراحة القلب والصدر

📞 011111552364

📍 بني سويف – برج أمان الحياة – أمام معرض شباب مصر – الدور الثالث`,
        images: [
          "photos/3.jpg"
        ]
      },
      {
        id: 2,
        title: "كل ما تود معرفته عن زراعة وتغيير الشرايين التاجية",
        summary: "متى يحتاج المريض للجراحة؟ وكيف نعيد إمداد القلب بالدم والأكسجين بصورة آمنة؟",
        content: `عند حدوث انسداد في الشرايين التاجية نتيجة ترسب الدهون، يتم أخذ أوعية دموية سليمة من الساق أو الصدر لعمل مسار بديل يتجاوز المنطقة المسدودة، ليعود الدم للتدفق بكامل كفاءته وحماية عضلة القلب.`,
        images: [
          "https://images.unsplash.com/photo-1551076805-e1869033e561?auto=format&fit=crop&w=700&q=80"
        ]
      }
    ];

    const grid = document.getElementById('articlesGrid');
    grid.innerHTML = articlesData.map(art => `
      <div class="article-card" onclick="openArticleModal(${art.id})">
        <div class="article-img-wrap">
          <img src="${art.images[0]}" alt="${art.title}">
        </div>
        <div class="article-card-body">
          <h3>${art.title}</h3>
          <p>${art.summary}</p>
          <span class="article-read-btn">قراءة المقال كاملاً ←</span>
        </div>
      </div>
    `).join('');

    function openArticleModal(id) {
      const art = articlesData.find(a => a.id === id);
      if (!art) return;
      document.getElementById('modalTitle').innerText = art.title;
      document.getElementById('modalBody').innerText = art.content;
      const gallery = document.getElementById('modalGallery');
      gallery.innerHTML = art.images.map(img => `<img src="${img}" alt="صورة">`).join('');
      document.getElementById('articleModal').classList.add('active');
    }

    function closeArticleModal() {
      document.getElementById('articleModal').classList.remove('active');
    }

    window.addEventListener('click', (e) => {
      const modal = document.getElementById('articleModal');
      if (e.target === modal) closeArticleModal();
    });
  </script>
</body>
</html>
