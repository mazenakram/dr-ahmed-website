<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ريلز وفيديوهات | د. أحمد حسن الماجري</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- القائمة العلوية -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo-wrap">
        <img src="photos/logo.png" alt="لوجو د. أحمد حسن الماجري" class="site-logo">
      </a>
      <button class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="services.html">العمليات والجراحات</a></li>
        <li><a href="videos.html" class="active">فيديوهات وريلز</a></li>
        <li><a href="feedback.html">آراء المرضى</a></li>
        <li><a href="articles.html">المقالات الطبية</a></li>
        <li><a href="faq.html">الأسئلة الشائعة</a></li>
      </ul>
    </div>
  </nav>

  <div class="container" style="padding-top: 40px; margin-bottom: 60px;">
    <div class="section-title">
      <h2>ريلز وشروحات د. أحمد حسن الماجري</h2>
      <p>معلومات طبية سريعة ومبسطة عن صحة القلب وجراحات الصدر</p>
    </div>

    <!-- شبكة الريلز الطولية بتصميم فيسبوك -->
    <div class="reels-grid" id="reelsContainer"></div>
  </div>

  <!-- Pop-up عرض الريل المتوافق مع مقاسات الموبايل والكمبيوتر -->
  <div class="reel-modal-overlay" id="reelModal">
    <div class="reel-modal-container">
      <button class="reel-modal-close" onclick="closeReelModal()">✕</button>
      <div class="reel-iframe-holder">
        <iframe id="reelIframe" src="" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" allowfullscreen="true"></iframe>
      </div>
    </div>
  </div>

  <!-- الأزرار العائمة -->
  <div class="floating-actions">
    <a href="https://wa.me/201111552364" target="_blank" class="float-btn whatsapp"><svg viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766 0-3.18-2.587-5.771-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.275.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824zm-3.423-14.416c-6.627 0-12 5.373-12 12 0 2.159.57 4.185 1.564 5.938l-1.564 5.719 5.86-1.537c1.706.938 3.666 1.48 5.74 1.48 6.627 0 12-5.373 12-12s-5.373-12-12-12z"/></svg></a>
    <a href="https://www.facebook.com/profile.php?id=61591004069520" target="_blank" class="float-btn facebook"><svg viewBox="0 0 24 24"><path d="M9 8H6v4h3v12h5V12h3.642L18 8h-4V6.333C14 5.374 14.5 5 15.688 5H18V0h-3.808C10.593 0 9 1.583 9 4.615V8z"/></svg></a>
  </div>

  <footer>
    <div class="container footer-bottom">جميع الحقوق محفوظة &copy; د. أحمد حسن الماجري</div>
  </footer>

  <script>
    document.getElementById('menuToggle').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('active');
    });

    /* =====================================================================
       قائمة الريلز:
       - fbUrl: رابط الريل مباشرة من الفيسبوك
       - thumb: صورة الغلاف الطولية للريل
       ===================================================================== */
    const reelsData = [
      {
        title: "جراحة القلب بالتدخل المحدود بدون شق الصدر",
        desc: "كيف تحمي المريض وتسرع التعافي في أيام معدودة.",
        thumb: "photos/3.jpg",
        fbUrl: "https://www.facebook.com/reel/1636594187406511"
      },
      {
        title: "علامات تحذيرية لضيق الشرايين التاجية",
        desc: "أعراض لا تتجاهلها للحفاظ على سلامة قلبك.",
        thumb: "photos/hero-bg.jpg",
        fbUrl: "https://www.facebook.com/facebook/videos/10153231379946729/"
      },
      {
        title: "إصلاح الصمام الميترالي بدقة وأمان",
        desc: "متى نفضل الإصلاح بدلاً من التغيير الكامل للصمام؟",
        thumb: "photos/hero-bg.jpg",
        fbUrl: "https://www.facebook.com/facebook/videos/10153231379946729/"
      },
      {
        title: "نصائح هامة بعد الخروج من عمليات القلب",
        desc: "إرشادات للعودة للحياة الطبيعية بكل ثقة.",
        thumb: "photos/hero-bg.jpg",
        fbUrl: "https://www.facebook.com/facebook/videos/10153231379946729/"
      }
    ];

    // رسم كروت الريلز
    const container = document.getElementById('reelsContainer');
    container.innerHTML = reelsData.map(r => `
      <div class="reel-card" onclick="openReelModal('${encodeURIComponent(r.fbUrl)}')">
        <img src="${r.thumb}" alt="${r.title}" class="reel-thumb">
        <div class="reel-overlay">
          <div class="reel-top-badge">🎬 ريلز</div>
          <div class="reel-play-btn">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <div class="reel-info">
            <h3>${r.title}</h3>
            <p>${r.desc}</p>
          </div>
        </div>
      </div>
    `).join('');

    function openReelModal(encodedUrl) {
      const modal = document.getElementById('reelModal');
      const iframe = document.getElementById('reelIframe');
      iframe.src = `https://www.facebook.com/plugins/video.php?href=${encodedUrl}&show_text=false&autoplay=true`;
      modal.classList.add('active');
    }

    function closeReelModal() {
      const modal = document.getElementById('reelModal');
      const iframe = document.getElementById('reelIframe');
      iframe.src = "";
      modal.classList.remove('active');
    }

    document.getElementById('reelModal').addEventListener('click', (e) => {
      if (e.target.id === 'reelModal') closeReelModal();
    });
  </script>
</body>
</html>
